targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Semantic, context-aware home shelves and sub-ms item-to-item recommendations."
description: >
  A two-tier recommendation engine for Jellyfin. Tier 1: all-MiniLM-L6-v2 semantic
  embeddings with a SIMD vector store, incremental indexing off library/user-data events,
  a More-Like-This API, and dynamic curation shelves. Tier 2 adds a per-user Microsoft.ML
  trained ranker that orders shelves by learned engagement probability.
